name: Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions: read-all

jobs:
  indentation:
    name: Indentation check
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install fish shell
        uses: fish-shop/install-fish-shell@b1a6669641551f2ab82e00dd4c5d6498cffe49e4 # v2.1.24
      - name: Check indentation
        uses: fish-shop/indent-check@a824d3b329524b84cb025ffddd942a1cdc7110f8 # v2.2.115
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install fish shell
        uses: fish-shop/install-fish-shell@b1a6669641551f2ab82e00dd4c5d6498cffe49e4 # v2.1.24
      - name: Syntax check fish files
        uses: fish-shop/syntax-check@81e41a3dfd119b8d16e25dd6bd3389f28e0cb929 # v2.2.113
  tests:
    name: Unit tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch repository history for access to tags in tests
        run: git fetch --prune --unshallow --tags --force
      - name: Install fish shell
        uses: fish-shop/install-fish-shell@b1a6669641551f2ab82e00dd4c5d6498cffe49e4 # v2.1.24
      - name: Install pond
        uses: fish-shop/install-plugin@06518227ecad4c666b38bb761226590409394b78 # v2.3.117
        with:
          plugin-manager: fisher
          plugins: ${{ github.workspace }}
      - name: Run Fishtape tests
        uses: fish-shop/run-fishtape-tests@e21e92ca567f1bf2cd7f8e51a7fb8a29bd73c1b8 # v2.3.117
        with:
          patterns: tests/**.fish
  install:
    name: Install tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        plugin-manager: [fisher, oh-my-fish]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install fish shell
        uses: fish-shop/install-fish-shell@b1a6669641551f2ab82e00dd4c5d6498cffe49e4 # v2.1.24
      - name: Install pond using ${{ matrix.plugin-manager }}
        uses: fish-shop/install-plugin@06518227ecad4c666b38bb761226590409394b78 # v2.3.117
        with:
          plugin-manager: ${{ matrix.plugin-manager }}
          plugins: ${{ github.workspace }}
      - name: Check pond is installed
        run: functions -q pond
        shell: fish {0}
